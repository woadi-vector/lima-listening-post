name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . numpy av
      - run: python -B -m unittest discover -s tests_next -q
      - run: python -m lima_next.demo --showcase --db demo-data/ci-showcase.sqlite3
